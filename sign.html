<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | EnRoute</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <main id="top">
    <header class="header">
      <div class="container nav-wrap">
        <a href="index.html" class="logo logo-header" aria-label="EnRoute home">
          <img class="logo-header-image" src="images/enroute-logo.png" alt="EnRoute">
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="index.html#services">Services</a>
          <a href="index.html#about">Why EnRoute</a>
          <a href="index.html#corporate">Corporate</a>
          <a href="index.html#faq">FAQs</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="login-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg> Log in</a>
          <a href="index.html#booking" class="button button-primary">Plan my trip</a>
          <button type="button" class="menu-button" id="menuButton" aria-label="Toggle menu"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
        </div>
      </div>
    </header>

    <section class="auth-page">
      <img src="https://images.unsplash.com/photo-1765475467677-579353b25ce0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=85&w=1800" alt="">
      <div class="hero-overlay"></div>
      <div class="container auth-wrap">
        <form class="modal auth-card auth-card-wide" action="sign.php" method="post" name="signForm">
          <span class="modal-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg></span>
          <p>Join EnRoute</p>
          <h2>Create your account</h2>
          <small>Fill in your details to create your EnRoute account.</small>
          <div class="auth-grid">
            <label><span>Title</span>
              <select name="title" required>
                <option value="" disabled selected>Select a title</option>
                <option>Mr</option>
                <option>Mrs</option>
                <option>Miss</option>
                <option>Dr</option>
                <option>Prof</option>
              </select>
            </label>
            <label><span>Gender</span>
              <select name="gender" required>
                <option value="" disabled selected>Select gender</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </label>
            <label><span>First name</span><input type="text" name="first_name" autocomplete="given-name" required></label>
            <label><span>Middle name</span><input type="text" name="middle_name" autocomplete="additional-name"></label>
            <label><span>Last name</span><input type="text" name="last_name" autocomplete="family-name" required></label>
            <label><span>Phone number</span><input type="tel" name="phone" autocomplete="tel" required></label>
          </div>
          <label><span>Email address</span><input type="email" name="email" placeholder="you@example.com" autocomplete="email" required></label>
          <div class="auth-grid">
            <label><span>Password</span><input type="password" name="password" id="password" autocomplete="new-password" required></label>
            <label><span>Re-enter password</span><input type="password" name="confirm_password" data-match="#password" autocomplete="new-password" required></label>
          </div>
          <button type="submit" class="button button-primary">Sign up</button>
          <div class="modal-foot">Have an account? <a href="login.html">Log in here</a></div>
        </form>
      </div>
    </section>

    <footer class="auth-footer">
      <div class="container footer-bottom"><span>© <span data-year>2026</span> EnRoute Travel &amp; Lifestyle.</span><span>Travel well. Arrive ready.</span></div>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
