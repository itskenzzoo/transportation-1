<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password | EnRoute</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
  </svg>

  <main id="top">
    <header class="header">
      <div class="container nav-wrap">
        <a href="index.html" class="logo logo-header" aria-label="EnRoute home">
          <img class="logo-header-image" src="images/enroute-logo.png" alt="EnRoute">
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="index.html#services">Services</a>
          <a href="index.html#about">Why EnRoute</a>
          <a href="index.html#corporate">Corporate</a>
          <a href="index.html#faq">FAQs</a>
          <a href="index.html#contact">Contact</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="login-button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg> Log in</a>
          <a href="index.html#booking" class="button button-primary">Plan my trip</a>
          <button type="button" class="menu-button" id="menuButton" aria-label="Toggle menu"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg></button>
        </div>
      </div>
    </header>

    <section class="auth-page">
      <img src="https://images.unsplash.com/photo-1765475467677-579353b25ce0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixlib=rb-4.1.0&q=85&w=1800" alt="">
      <div class="hero-overlay"></div>
      <div class="container auth-wrap">
        <form class="modal auth-card" action="#" method="post">
          <span class="modal-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail"/></svg></span>
          <p>Account help</p>
          <h2>Forgot your password?</h2>
          <small>Enter your email address below, and we’ll send you a link to reset your password.</small>
          <label><span>Email address</span><input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></label>
          <button type="submit" class="button button-primary">Send reset link</button>
          <div class="modal-foot">Remember your password? <a href="login.html">Log in here</a></div>
        </form>
      </div>
    </section>

    <footer class="auth-footer">
      <div class="container footer-bottom"><span>© <span data-year>2026</span> EnRoute Travel &amp; Lifestyle.</span><span>Travel well. Arrive ready.</span></div>
    </footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
